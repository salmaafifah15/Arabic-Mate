function questions(theme){return theme.words.map((w,i)=>({id:`${theme.id}-${i}`,arabic:w[0],answer:w[2],options:[...Array(4)].map((_,n)=>theme.words[(i+n)%theme.words.length][2]).sort((a,b)=>a.localeCompare(b,'id')),explanation:`${w[0]} (${w[1]}) berarti “${w[2]}”.`}))}


const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='arabicmate:v1';let progress={learned:[],dialogs:[],attempts:[]};try{const v=JSON.parse(localStorage.getItem(key));if(v&&Array.isArray(v.learned)&&Array.isArray(v.dialogs)&&Array.isArray(v.attempts))progress=v}catch{}
let search='',filter='semua',tab='kosakata',card=0,flipped=false,step=0,chat=[],answers={},submitted=false,current='';
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3500)}
function save(){try{localStorage.setItem(key,JSON.stringify(progress))}catch{toast('Penyimpanan browser tidak tersedia. Progres hanya bertahan selama sesi ini.')}}
function route(){return location.hash.slice(1)||'beranda'}
function go(r){location.hash=r}
function arab(s,cls=''){return `<span lang="ar" dir="rtl" class="arab ${cls}">${esc(s)}</span>`}
function render(){const r=route();$('#app').innerHTML=`<aside><a class="brand" href="#beranda"><span class="brand-icon">ع</span><span>arabic<span class="light">mate</span><small>TEMAN BELAJAR BAHASA ARAB</small></span></a><div class="menu-label">RUANG BELAJARMU</div><nav>${[['beranda','⌂','Beranda'],['tema','▦','Jelajahi tema'],['progres','◷','Progres belajar']].map(([id,ico,t])=>`<a href="#${id}" class="${r===id||(id==='tema'&&r.startsWith('belajar/'))?'active':''}"><span>${ico}</span>${t}</a>`).join('')}</nav><div class="side-note"><span>✦</span><h3>Sedikit, tapi setiap hari.</h3><p>Satu kata baru hari ini, satu langkah lebih dekat.</p><span lang="ar" dir="rtl">خُطْوَةً بِخُطْوَةٍ</span></div><a class="about-link" href="#tentang">ⓘ Tentang Arabic Mate</a></aside><div class="shell"><header><span>Belajar dengan rasa ingin tahu <span class="spark">✦</span></span><span class="device">◉ Progres di perangkat ini</span></header><main id="main" tabindex="-1">${r.startsWith('belajar/')?lesson(r.split('/')[1]):r==='tema'?themePage():r==='progres'?dashboard():r==='tentang'?about():home()}</main><footer>Arabic Mate <span>Belajar pelan-pelan. Bertumbuh setiap hari.</span><span>Versi mandiri · Tanpa akun</span></footer></div>`;bind();}
function home(){const last=progress.learned.length?themes.find(t=>t.id===progress.learned.at(-1).split(':')[0])||themes[0]:themes[0];return `<div class="eyebrow">أَهْلًا وَسَهْلًا · SELAMAT DATANG</div><section class="hero"><div><div class="pill">✦ Teman kecil, perjalanan besar</div><h1>Bahasa baru.<br>Cerita <em>baru.</em></h1><p>Kenali bahasa Arab lewat hal-hal yang dekat denganmu. Mulai dari satu kata, lalu berani bercakap.</p><a class="btn dark" href="#belajar/${last.id}">${progress.learned.length?'Lanjutkan belajar':'Mulai petualangan'} <span>↗</span></a><a class="text-link" href="#tema">Lihat semua tema →</a><div class="hero-tags"><span>✓ Untuk pemula</span><span>✓ Belajar sesuai ritmemu</span></div></div><div class="hero-art" aria-label="Ilustrasi buku bahasa Arab"><span class="orb o1"></span><span class="orb o2"></span><div class="float hello">مَرْحَبًا! <small>Halo, teman!</small></div><div class="book"><div class="book-page"><small>PERJALANAN DIMULAI DARI</small><span lang="ar" dir="rtl">أ ب ت</span><strong>Satu kata baru.</strong><div class="book-lines"></div></div></div><div class="float word">✦ <span>كِتَابٌ<small>kitābun · buku</small></span></div><span class="art-star">✳</span></div></section><section class="stats"><div><span class="stat-icon peach">▦</span><div><strong>6 tema</strong><small>Dekat dengan keseharian</small></div></div><div><span class="stat-icon blue">ع</span><div><strong>36 kosakata</strong><small>Langkah kecil yang berarti</small></div></div><div><span class="stat-icon yellow">↗</span><div><strong>${progress.learned.length} dipelajari</strong><small>Perjalananmu sudah dimulai</small></div></div></section><div class="section-head"><div><div class="eyebrow">DUNIA KECIL UNTUK DIJELAJAHI</div><h2>Hari ini, mau belajar apa?</h2><p>Pilih satu tema. Temukan kata dan cerita di dalamnya.</p></div><a class="text-link" href="#tema">Semua tema ↗</a></div><div class="grid">${themes.map(themeCard).join('')}</div><section class="journey"><div><div class="eyebrow">TIDAK PERLU BURU-BURU</div><h2>Empat langkah, banyak cerita.</h2></div><div class="steps">${['Kenali kosakata','Balik flashcard','Coba percakapan','Uji pemahaman'].map((s,i)=>`<div><b>0${i+1}</b><span>${s}</span></div>`).join('')}</div></section>`}
function themeCard(t){const n=progress.learned.filter(id=>id.startsWith(t.id+':')).length;return `<a class="theme-card" href="#belajar/${t.id}"><div class="card-art ${t.color}"><span class="scene-icon">${t.icon}</span><span class="scene-word" lang="ar" dir="rtl">${t.arabic}</span><span class="level">Pemula · Fusha</span></div><div class="card-body"><small>6 KOSAKATA · 1 SIMULASI</small><h3>${t.title}<span>↗</span></h3><p>${t.description}</p><div class="card-progress"><span style="width:${n/6*100}%"></span></div><div class="card-foot"><span>${n}/6 kata dipelajari</span><span>± 10 menit</span></div></div></a>`}
function themePage(){return `<div class="eyebrow">PILIH TEMPAT CERITAMU DIMULAI</div><h1 class="page-title">Jelajahi tema.</h1><p class="intro">Dari pasar sampai ruang kelas, bahasa Arab hadir di sekitarmu.</p><div class="toolbar"><input id="search" type="search" placeholder="Cari tema atau kosakata…" value="${esc(search)}" aria-label="Cari tema atau kosakata"><select id="filter" aria-label="Filter progres"><option value="semua" ${filter==='semua'?'selected':''}>Semua tema</option><option value="baru" ${filter==='baru'?'selected':''}>Belum dimulai</option><option value="mulai" ${filter==='mulai'?'selected':''}>Sudah dimulai</option></select></div><div id="theme-results" class="grid">${filtered()}</div>`}
function filtered(){const ts=themes.filter(t=>JSON.stringify(t).toLowerCase().includes(search.toLowerCase())&&(filter==='semua'||(filter==='mulai')===progress.learned.some(id=>id.startsWith(t.id+':'))));return ts.length?ts.map(themeCard).join(''):'<p class="empty">Tema belum ditemukan. Coba kata lain.</p>'}
function lesson(id){const t=themes.find(t=>t.id===id);if(!t)return '<h1>Tema tidak ditemukan</h1><a href="#tema">Kembali ke tema</a>';if(current!==id){current=id;tab='kosakata';card=0;flipped=false;step=0;chat=[];answers={};submitted=false}return `<a class="back" href="#tema">← Semua tema</a><section class="lesson-banner ${t.color}"><div><div class="eyebrow">PEMULA · BAHASA ARAB FUSHA</div><h1>${t.title}</h1><p>${t.place}</p></div><div>${arab(t.arabic)}<span class="banner-icon">${t.icon}</span></div></section><div class="tabs" role="tablist">${[['kosakata','01','Kosakata'],['flashcard','02','Flashcard'],['dialog','03','Percakapan'],['kuis','04','Kuis']].map(([k,n,s])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}"><small>${n}</small> ${s}</button>`).join('')}</div><section class="lesson-content" role="tabpanel">${tab==='kosakata'?vocab(t):tab==='flashcard'?flash(t):tab==='dialog'?dialog(t):quiz(t)}</section>`}
function vocab(t){return `<div class="section-head"><div><h2>Mulai dengan satu kata.</h2><p>Baca, dengarkan jika tersedia, lalu tandai kata yang sudah dipelajari.</p></div></div><div class="vocab-grid">${t.words.map((w,i)=>{const done=progress.learned.includes(`${t.id}:${i}`);return `<article class="vocab-card">${arab(w[0])}<i>${w[1]}</i><strong>${w[2]}</strong><div><button class="audio" data-speak="${i}" aria-label="Dengarkan ${w[2]}">◖ Audio</button><button class="mark ${done?'marked':''}" data-learn="${i}" aria-pressed="${done}">${done?'✓ Dipelajari':'+ Tandai'}</button></div></article>`}).join('')}</div><p class="note">Audio menggunakan suara bahasa Arab bawaan perangkat jika tersedia. Transliterasi merupakan bantuan baca, bukan penilaian pelafalan.</p><button class="btn dark" data-next="flashcard">Latihan flashcard →</button>`}
function flash(t){const w=t.words[card];return `<div class="center"><div class="eyebrow">KARTU ${card+1} DARI ${t.words.length}</div><h2>Masih ingat artinya?</h2><p>Klik kartu untuk membuka arti dan transliterasinya.</p><button class="flash ${flipped?'flipped':''}" id="flip" aria-label="${flipped?'Tampilkan kata Arab':'Tampilkan arti'}">${flipped?`<strong>${w[2]}</strong><i>${w[1]}</i>`:arab(w[0])}<small>↻ Klik untuk membalik</small></button><div class="flash-controls"><button class="btn" id="prev-card">← Sebelumnya</button><span>${card+1} / 6</span><button class="btn" id="next-card">Berikutnya →</button></div><button class="btn dark" data-next="dialog">Coba percakapan →</button></div>`}
function dialog(t){const done=step>=t.dialog.length;return `<div class="dialog-layout"><div class="stage ${t.color}"><div class="stage-sun"></div><span class="stage-emoji">${t.icon}</span><h2>${t.place}</h2>${arab(t.arabic)}<p>Teman bicaramu: ${t.role}</p><div class="badge">Simulasi terpandu · bukan AI</div></div><div><h2>Satu sapaan, satu percakapan.</h2><p>Pilih balasan yang ingin kamu ucapkan. Kedua pilihan valid untuk latihan.</p><div class="chat" aria-live="polite">${chat.map(x=>`<div class="bubble ${x.me?'me':''}">${arab(x.ar)}<small>${esc(x.id)}</small></div>`).join('')}${!done?`<div class="bubble">${arab(t.dialog[step][0])}<small>${t.dialog[step][1]}</small></div>`:'<div class="complete">✦ Percakapan selesai. Bagus, kamu sudah mencoba!</div>'}</div>${done?'<button class="btn dark" data-next="kuis">Lanjut ke kuis →</button><button class="btn" id="restart-dialog">Ulang dialog</button>':`<div class="choices">${t.dialog[step][2].map((c,i)=>`<button data-reply="${i}">${arab(c[0])}<small>${c[1]}</small></button>`).join('')}</div>`}</div></div>`}
function quiz(t){const qs=questions(t),score=Math.round(qs.filter(q=>answers[q.id]===q.answer).length/qs.length*100);return `<div class="section-head"><div><h2>${submitted?'Hasil belajarmu.':'Saatnya mencoba sendiri.'}</h2><p>${submitted?'Periksa pembahasannya dan ulangi kata yang belum dikuasai.':'Pilih arti yang sesuai untuk setiap kata. Tidak perlu terburu-buru.'}</p></div>${submitted?`<div class="score">${score}<small>/100</small></div>`:''}</div>${qs.map((q,i)=>`<article class="question"><div><span class="q-num">${i+1}</span> Apa arti ${arab(q.arabic)}?</div><div class="options">${q.options.map(o=>`<button data-question="${q.id}" data-answer="${esc(o)}" ${submitted?'disabled':''} class="${answers[q.id]===o?'selected ':''}${submitted&&o===q.answer?'correct ':''}${submitted&&answers[q.id]===o&&o!==q.answer?'wrong':''}" aria-pressed="${answers[q.id]===o}">${o}</button>`).join('')}</div>${submitted?`<p class="explanation">${answers[q.id]===q.answer?'✓ Benar.':'↻ Mari diingat kembali.'} ${q.explanation}</p>`:''}</article>`).join('')}<div class="actions">${submitted?'<button class="btn dark" id="retry-quiz">Ulangi kuis</button><a class="btn" href="#progres">Lihat progres →</a>':`<button class="btn dark" id="submit-quiz" ${Object.keys(answers).length<qs.length?'disabled':''}>Periksa jawaban (${Object.keys(answers).length}/6)</button>`}</div>`}
function dashboard(){const avg=progress.attempts.length?Math.round(progress.attempts.reduce((s,a)=>s+a.score,0)/progress.attempts.length):0;return `<div class="eyebrow">SETIAP LANGKAH LAYAK DIRAYAKAN</div><h1 class="page-title">Perjalanan belajarmu.</h1><p class="intro">Progres tersimpan di browser ini. Ekspor cadangan agar perjalananmu tetap terjaga.</p><section class="stats"><div><div><strong>${progress.learned.length} / 36</strong><small>Kosakata dipelajari</small></div></div><div><div><strong>${progress.dialogs.length} / 6</strong><small>Simulasi selesai</small></div></div><div><div><strong>${avg}</strong><small>Rata-rata nilai kuis</small></div></div></section><div class="grid">${themes.map(themeCard).join('')}</div><h2 class="history-title">Riwayat kuis</h2>${progress.attempts.length?`<div class="history">${[...progress.attempts].reverse().map(a=>`<div><span>${esc(themes.find(t=>t.id===a.theme)?.title||'Tema')}<small>${new Date(a.date).toLocaleString('id-ID')}</small></span><strong>${a.score}<small>/100</small></strong></div>`).join('')}</div>`:'<p class="empty">Belum ada kuis yang diselesaikan. Pilih tema untuk mulai belajar.</p>'}<div class="actions"><button class="btn dark" id="export">↓ Ekspor progres</button><label class="btn file-label">↑ Impor progres<input type="file" id="import" accept="application/json,.json"></label><button class="btn danger" id="reset">Hapus progres</button></div><p class="note">Progres tidak tersinkron antarperangkat dan dapat hilang ketika data browser dibersihkan. Nilai ditujukan untuk latihan mandiri.</p>`}
function about(){return `<div class="eyebrow">TEMAN BELAJARMU</div><h1 class="page-title">Tentang Arabic Mate.</h1><article class="about"><h2>Belajar dari kehidupan sehari-hari.</h2><p>Arabic Mate adalah media latihan bahasa Arab fusha tingkat pemula. Pelajari kosakata, ingat kembali melalui flashcard, coba simulasi percakapan, lalu evaluasi pemahaman melalui kuis.</p><h2>Ruang latihan mandiri</h2><p>Versi ini berjalan tanpa akun dan database. Percakapan mengikuti skenario yang telah disusun, bukan respons AI. Audio bergantung pada ketersediaan suara bahasa Arab di perangkat. Contoh dialog menggunakan bentuk sapaan maskulin tunggal pada beberapa kalimat.</p><h2>Data dan privasi</h2><p>Progres disimpan secara lokal pada browser. Aplikasi tidak mengirim progres ke server. Tombol impor dan ekspor memungkinkan pemindahan cadangan secara manual. Penyedia hosting tetap dapat mencatat akses website sesuai kebijakannya.</p><h2>Pengembangan selanjutnya</h2><p>Integrasi akun, penyimpanan lintas perangkat, pengelolaan materi, serta AI memerlukan backend dan konfigurasi layanan tersendiri. Materi awal perlu ditinjau pengajar bahasa Arab sebelum digunakan sebagai kurikulum formal.</p><a class="btn dark" href="#tema">Jelajahi tema →</a></article>`}
function bind(){document.querySelectorAll('[data-tab],[data-next]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab||b.dataset.next;render()});const t=themes.find(t=>t.id===current);document.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{const id=`${t.id}:${b.dataset.learn}`;progress.learned=progress.learned.includes(id)?progress.learned.filter(x=>x!==id):[...progress.learned,id];save();render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{if(!('speechSynthesis'in window)){toast('Audio tidak didukung browser ini.');return}const voices=speechSynthesis.getVoices(),voice=voices.find(v=>v.lang.startsWith('ar'));if(!voice){toast('Suara Arab belum tersedia di perangkat ini.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.words[b.dataset.speak][0]);u.voice=voice;u.lang='ar';u.rate=.8;speechSynthesis.speak(u)});if($('#search'))$('#search').oninput=e=>{search=e.target.value;$('#theme-results').innerHTML=filtered()};if($('#filter'))$('#filter').onchange=e=>{filter=e.target.value;$('#theme-results').innerHTML=filtered()};if($('#flip'))$('#flip').onclick=()=>{flipped=!flipped;render()};['prev-card','next-card'].forEach(id=>{if($('#'+id))$('#'+id).onclick=()=>{card=(card+(id==='next-card'?1:5))%6;flipped=false;render()}});document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{const d=t.dialog[step],reply=d[2][b.dataset.reply];chat.push({ar:d[0],id:d[1]},{ar:reply[0],id:reply[1],me:true});step++;if(step===t.dialog.length&&!progress.dialogs.includes(t.id)){progress.dialogs.push(t.id);save()}render();$('.chat')?.scrollTo(0,$('.chat').scrollHeight)});if($('#restart-dialog'))$('#restart-dialog').onclick=()=>{step=0;chat=[];render()};document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{answers[b.dataset.question]=b.dataset.answer;const y=scrollY;render();scrollTo(0,y)});if($('#submit-quiz'))$('#submit-quiz').onclick=()=>{const qs=questions(t);if(Object.keys(answers).length!==qs.length)return;submitted=true;progress.attempts.push({theme:t.id,score:Math.round(qs.filter(q=>answers[q.id]===q.answer).length/qs.length*100),date:new Date().toISOString()});save();render();$('.lesson-content').scrollIntoView({behavior:'smooth'})};if($('#retry-quiz'))$('#retry-quiz').onclick=()=>{answers={};submitted=false;render()};if($('#export'))$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,...progress},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='arabicmate-progres.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if($('#reset'))$('#reset').onclick=()=>{if(confirm('Hapus semua progres pada browser ini? Ekspor cadangan terlebih dahulu jika diperlukan.')){progress={learned:[],dialogs:[],attempts:[]};save();render();toast('Progres telah dihapus.')}};if($('#import'))$('#import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>1000000)throw Error();const v=JSON.parse(await f.text());const ids=new Set(themes.map(t=>t.id)),words=new Set(themes.flatMap(t=>t.words.map((_,i)=>`${t.id}:${i}`)));if(v.version!==1||!Array.isArray(v.learned)||!v.learned.every(x=>words.has(x))||!Array.isArray(v.dialogs)||!v.dialogs.every(x=>ids.has(x))||!Array.isArray(v.attempts)||!v.attempts.every(a=>ids.has(a.theme)&&Number.isFinite(a.score)&&a.score>=0&&a.score<=100&&typeof a.date==='string'&&Number.isFinite(Date.parse(a.date))))throw Error();if(!confirm('Ganti progres saat ini dengan progres dari file cadangan?'))return;progress={learned:[...new Set(v.learned)],dialogs:[...new Set(v.dialogs)],attempts:v.attempts.map(a=>({theme:a.theme,score:a.score,date:a.date}))};save();render();toast('Progres berhasil diimpor.')}catch{toast('File progres tidak valid. Gunakan file ekspor Arabic Mate.')}};}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></body></html>
